[project]
name = "orion-validate"
version = "1.0.1"
description = "Chuck-style AI validation framework with bias detection, PII sanitization, and adversarial filtering"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sam Patchet", email = "calionestevar88@gmail.com"}
]
keywords = [
    "ai-validation",
    "machine-learning-validation",
    "bias-detection",
    "pii-sanitization",
    "prompt-injection",
    "security-testing",
    "ai-safety",
    "compliance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.30.0",
    "torch>=2.0.0"
]
music = [
    # For music industry features - currently no external deps,
    # but reserved for future audio processing libraries
    # "librosa>=0.10.0", # Audio analysis (future)
    # "torchaudio>=2.0.0", # Audio preprocessing (future)
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.scripts]
orion-validate = "orionai.awesome:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/calionestevar/OrionAI"
Repository = "https://github.com/calionestevar/OrionAI"

[tool.setuptools]
package-dir = {"" = "Python"}

[tool.setuptools.packages.find]
where = ["Python"]

[tool.setuptools.package-data]
"*" = ["*.json"]